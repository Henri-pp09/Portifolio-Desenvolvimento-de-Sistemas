<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fontawesome/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Login | Aviario Sonoro</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body class="pagina-carregando">
    <div class="tela-carregamento" role="status" aria-live="polite" aria-label="Carregando pagina">
        <div class="carregamento-conteudo">
            <i class="fa-solid fa-feather" aria-hidden="true"></i>
            <strong>Aviario Sonoro</strong>
            <span class="carregamento-anel" aria-hidden="true"></span>
            <p>Preparando o ninho...</p>
        </div>
    </div>
    <main class="auth-pagina">
        <section class="chamada">
            <a class="marca" href="hub.html"><i class="fa-solid fa-feather" aria-hidden="true"></i>Aviario Sonoro</a>
            <p class="etiqueta">entre no ninho</p>
            <h1>Volte para o feed das aves mais barulhentas.</h1>
            <p>Entre com seu usuario para ver seu perfil e participar dessa rede social aviaria.</p>
        </section>

        <section class="cartao-auth">
            <h2>Login</h2>
            <form id="formLogin">
                <label>
                    Usuario
                    <input id="loginUsuario" type="text" placeholder="ex: tucano_mestre" required>
                </label>
                <label>
                    Senha
                    <input id="loginSenha" type="password" placeholder="Sua senha" required>
                </label>
                <button type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>Entrar</button>
                <p class="mensagem" id="mensagemLogin"></p>
            </form>
            <p class="rodape-form">Ainda nao tem perfil? <a href="cadastro.html">Criar agora</a></p>
            <p class="rodape-form"><a href="hub.html">Voltar para o feed</a></p>
        </section>
    </main>

    <div class="cursor" aria-hidden="true">
        <span class="cursor-ring"></span>
        <span class="cursor-dot"></span>
        <i class="fa-solid fa-feather cursor-icon"></i>
    </div>
    <script src="armazenamento.js"></script>
    <script src="estado.js"></script>
    <script src="aparencia.js"></script>
    <script src="cursor.js"></script>
    <script src="auth.js"></script>
</body>
</html>
