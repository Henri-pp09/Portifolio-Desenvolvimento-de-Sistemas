<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fontawesome/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Criar Perfil | Aviario Sonoro</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body>
    <main class="auth-pagina">
        <section class="chamada">
            <a class="marca" href="hub.html"><i class="fa-solid fa-feather" aria-hidden="true"></i>Aviario Sonoro</a>
            <p class="etiqueta">novo perfil</p>
            <h1>Crie sua identidade dentro do Aviario.</h1>
            <p>Monte seu perfil para aparecer no feed com nome, usuario e uma bio no clima do site.</p>
        </section>

        <section class="cartao-auth">
            <h2>Criar perfil</h2>
            <form id="formCadastro">
                <label>
                    Escreva aqui seu Nome Completo! 
                    <input id="cadastroNome" type="text" placeholder="Ex: Gabriel Passarologo" required>
                </label>
                <label>
                    Escreva aqui seu nome de Usuario!
                    <input id="cadastroUsuario" type="text" placeholder="Ex: gabriel_aviario" required>
                </label>
                <label>
                    Escreva aqui sua Bio!
                    <textarea id="cadastroBio" placeholder="Qual ave representa melhor você?"></textarea>
                </label>
                <label>
                    Escreva aqui sua Senha!
                    <input id="cadastroSenha" type="password" placeholder="Ex: 1234" required>
                </label>
                <button type="submit"><i class="fa-solid fa-user-plus" aria-hidden="true"></i>Criar perfil</button>
                <p class="mensagem" id="mensagemCadastro"></p>
            </form>
            <p class="rodape-form">Ja tem perfil? <a href="login.html">Entrar</a></p>
            <p class="rodape-form"><a href="hub.html">Voltar para o feed</a></p>
        </section>
    </main>

    <div class="cursor" aria-hidden="true">
        <span class="cursor-ring"></span>
        <span class="cursor-dot"></span>
        <i class="fa-solid fa-feather cursor-icon"></i>
    </div>
    <script src="armazenamento.js"></script>
    <script src="estado.js"></script>
    <script src="aparencia.js"></script>
    <script src="cursor.js"></script>
    <script src="auth.js"></script>
</body>
</html>
