<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Aviario Sonoro</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <header class="barra-site">
        <nav>
            <a class="marca" href="hub.html">Aviario Sonoro</a>
            <div class="links-nav">
                <a href="hub.html">Feed</a>
                <a href="catalogo.html">Catalogo</a>
                <a href="sobre.html">Sobre o projeto</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
    </header>

    <main class="pagina-perfil">
        <section class="capa-perfil" id="capaPerfil">
            <div class="avatar-grande" id="avatarPerfil">AS</div>
            <div class="info-perfil">
                <p class="etiqueta">perfil de usuario</p>
                <h1 id="nomePerfil">Visitante do Aviario</h1>
                <p id="bioPerfil">Apaixonado por passaros, cantos estranhos e fotos com muita aura.</p>
                <div class="metricas">
                    <span><strong id="contagemPosts">0</strong> posts</span>
                </div>
            </div>
            <button type="button" class="botao-link" id="botaoSair">Sair da conta</button>
        </section>

        <section class="grade-perfil">
            <aside class="painel">
                <h2>Sobre</h2>
                <p><strong>Usuario:</strong> <span id="usuarioPerfil">@visitante</span></p>

                <h2>Imagens do perfil</h2>
                <label class="rotulo-arquivo">
                    Foto de perfil
                    <input type="file" id="campoAvatar" accept="image/*">
                </label>
                <label class="rotulo-arquivo">
                    Banner do perfil
                    <input type="file" id="campoBanner" accept="image/*">
                </label>
                <p class="mensagem" id="mensagemImagens"></p>

                <h2>Passaros favoritos</h2>
                <div id="listaFavoritos" class="grade-favoritos"></div>
            </aside>

            <div class="coluna-posts" id="colunaPosts"></div>
        </section>
    </main>

    <div class="cursor"></div>
    <script src="armazenamento.js"></script>
    <script src="especies.js"></script>
    <script src="cursor.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
